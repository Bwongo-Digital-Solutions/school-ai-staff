name: Build Android APK

on:
  push:
    branches:
      # main is where a release comes from — see the `version` and `release` jobs below.
      - main
      # Any working branch, rather than one named branch. The single name here meant that moving
      # the work onto a new branch silently stopped producing APKs, with nothing to notice.
      - claude/**
    tags:
      # A tag pushed by hand still releases, for a version somebody wants to name themselves.
      #
      # Both shapes, because this repository already tags plain semver — `1.0.0`, not `v1.0.0` —
      # and a trigger that only matched the `v` form would have sat there doing nothing while
      # looking correct.
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

# One release at a time, per ref.
#
# Not a precaution — this was watched happening. Two pull requests merged a minute apart, both runs
# read the tag list before either had released, both settled on 1.0.1, and both published to it. The
# tag ended up on the newer commit while the APK attached to it came from the older one, because
# that run finished last. Every phone would have installed a build that was not the code the release
# named.
#
# Serialised, the second run's `version` job starts after the first release exists, sees its tag, and
# takes the next number. `cancel-in-progress: false` because a release that has already begun must
# finish; the cost is that a third merge arriving while one waits replaces the waiting one, so a
# middle commit can go unreleased. The newest code always ships, which is the property that matters.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # What version this build is, decided in one place because three things need to agree: the tag,
  # the `version` a phone shows, and the `versionCode` Android compares to decide whether an APK is
  # an upgrade. When those disagree the failure is silent — the install just doesn't offer itself.
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      code: ${{ steps.pick.outputs.code }}
      release: ${{ steps.pick.outputs.release }}

    steps:
      # Every tag, because the next version is the highest one that exists plus one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        name: The next version
        env:
          # A merge that should not ship — a README fix, a workflow change — says so in the commit
          # message. Nothing else here has to be remembered.
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Somebody named this version. Use it exactly.
            tag="${GITHUB_REF_NAME}"
            release=true
          elif [ "${GITHUB_REF_NAME}" = "main" ] && ! printf '%s' "${HEAD_MESSAGE}" | grep -qF '[no release]'; then
            latest=$(git tag --list --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            latest=${latest:-1.0.0}
            prefix=""
            case "$latest" in v*) prefix="v"; latest="${latest#v}";; esac
            major=$(printf '%s' "$latest" | cut -d. -f1)
            minor=$(printf '%s' "$latest" | cut -d. -f2)
            patch=$(printf '%s' "$latest" | cut -d. -f3)
            # A patch bump per merge is the floor, not the rule.
            next="${major}.${minor}.$((patch + 1))"

            # Deciding that a change is a minor or a major one is a judgement, and app.json is where
            # that judgement is written down. Setting `expo.version` above the highest tag names the
            # next release; leaving it alone lets the patch bump carry on. This is why it is read
            # rather than only written: pushing a tag by hand also works, but it is a thing somebody
            # has to remember and cannot be reviewed, and a version is a decision about the software
            # that belongs in the software.
            declared=$(python3 -c "import json;print(json.load(open('app.json'))['expo'].get('version','0.0.0'))")
            case "$declared" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) declared="0.0.0" ;;
            esac

            # Whichever is higher. Once a declared version has been released the tag overtakes it,
            # so a stale app.json cannot pin the version or cause a second release of one.
            version=$(printf '%s\n%s\n' "$next" "$declared" | sort -V | tail -1)
            tag="${prefix}${version}"
            release=true
          else
            # A working branch. Build it, so a broken build is caught before it is merged, but do
            # not put a version on it.
            tag=""
            release=false
          fi

          version="${tag#v}"
          version="${version:-0.0.0}"

          # Android compares versionCode, an integer, and refuses anything that is not higher than
          # what is installed. Derived from the semver so the two can never drift: 1.2.3 -> 10203.
          major=$(printf '%s' "$version" | cut -d. -f1)
          minor=$(printf '%s' "$version" | cut -d. -f2)
          patch=$(printf '%s' "$version" | cut -d. -f3)
          code=$(( major * 10000 + minor * 100 + patch ))
          [ "$code" -gt 0 ] || code=1

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "code=$code"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

          echo "Building $version (tag '${tag:-none}', versionCode $code, release $release)"

  apk:
    name: Assemble release APK
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # Stamped into the checkout rather than committed back to main. A workflow that commits to
      # the branch it is triggered by is a loop waiting to be tripped, and the version is a fact
      # about a build, not about the source: the tag already records it.
      - name: Stamp the version
        if: needs.version.outputs.release == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CODE: ${{ needs.version.outputs.code }}
        run: |
          node -e '
            const fs = require("node:fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.VERSION;
            app.expo.android = { ...app.expo.android, versionCode: Number(process.env.CODE) };
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          grep -E '"version"|"versionCode"' app.json

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      # Sign with the project's own key, not the one every React Native project ships with.
      #
      # prebuild wires the release build to the template's debug.keystore — CN=Android Debug, alias
      # androiddebugkey, password `android`, byte-identical in every RN project in the world.
      # Android accepts an update from whoever holds the signing key, so an APK signed with that one
      # can be replaced on a teacher's phone by anybody who cares to build one.
      #
      # The key is written to disk only for the length of this job. See "Signing" in the README for
      # how to generate it, and for the one-off cost: a phone holding a debug-signed build cannot
      # update over this and has to uninstall first.
      - name: Sign the release with the project key
        if: needs.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set, so this release would be signed with the React Native debug key that every project shares. Refusing to publish it — see Signing in the README."
            exit 1
          fi

          # base64 -d rejects the whitespace some tools wrap at 76 columns, and `base64` on macOS
          # wraps by default — so strip it rather than fail on a secret that is actually correct.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/release.keystore 2>/dev/null || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Re-run 'base64 -w0 your.keystore' (or 'base64 -i' on macOS) and paste the whole output."
            exit 1
          }
          echo "Keystore decoded: $(wc -c < android/app/release.keystore) bytes"

          # keytool reuses the store password for the key when you press enter at the prompt, so an
          # unset ANDROID_KEY_PASSWORD is the common case rather than a mistake. Gradle, given an
          # empty one, fails deep inside the build with nothing that points here.
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          KEY_ALIAS="${KEY_ALIAS:-school-ai-staff}"

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is empty. Set it to the password you gave keytool."
            exit 1
          fi

          # Open the keystore before building. Gradle's failure for a wrong password or a missing
          # alias is a wall of Java; this says which of the four secrets is wrong, which is the only
          # thing anybody can act on.
          # Combined output, not just stderr: keytool prints "keytool error: ..." on **stdout**, so
          # capturing 2> alone gets an empty file and every branch below falls through to the
          # unhelpful one. Verified against a real keystore rather than assumed.
          if ! keytool -list -keystore android/app/release.keystore -alias "$KEY_ALIAS" \
                 -storepass "$KEYSTORE_PASSWORD" > keytool.err 2>&1; then
            if grep -qi 'password was incorrect\|Keystore was tampered' keytool.err; then
              echo "::error::The keystore did not open with ANDROID_KEYSTORE_PASSWORD. Check that secret against the password you gave keytool."
            elif grep -qi 'does not exist\|Alias .* does not exist' keytool.err; then
              echo "::error::The keystore opened, but it holds no key called '$KEY_ALIAS'. Set ANDROID_KEY_ALIAS to the -alias you used with keytool; run 'keytool -list -keystore your.keystore' to see it."
            else
              echo "::error::The keystore could not be read. $(grep -v 'Picked up JAVA_TOOL_OPTIONS' keytool.err | head -3 | tr '\n' ' ')"
            fi
            exit 1
          fi
          echo "Keystore opens, and holds the key '$KEY_ALIAS'."

          {
            echo "ESCHOOL_UPLOAD_STORE_FILE=release.keystore"
            echo "ESCHOOL_UPLOAD_STORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "ESCHOOL_UPLOAD_KEY_ALIAS=${KEY_ALIAS}"
            echo "ESCHOOL_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}"
          } >> android/gradle.properties

          node scripts/use-release-signing.mjs

      - name: Assemble release APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee gradle.log

      # A run's log is a download behind a short-lived authenticated URL, so "the build failed" is
      # where the reading stops for anyone who cannot fetch it. This puts what Gradle actually said
      # on the pull request.
      - name: Say what Gradle said
        if: failure()
        working-directory: android
        run: |
          said=$(grep -A 12 -m 1 -E '^(FAILURE:|\* What went wrong:)' gradle.log | head -20 | tr '\n' '%' | sed 's/%/%0A/g')
          if [ -n "$said" ]; then
            echo "::error title=Gradle::${said}"
          else
            echo "::error title=Gradle::$(tail -20 gradle.log | tr '\n' '%' | sed 's/%/%0A/g')"
          fi

      # What actually came out. A release signed with the shared debug key must never leave this
      # job, and the only way to know is to look at the APK rather than at the intent.
      - name: Check the APK is not debug-signed
        if: needs.version.outputs.release == 'true'
        working-directory: android
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" | tee signer.txt

          if grep -qi 'CN=Android Debug' signer.txt; then
            echo "::error::The release APK is signed with the Android debug certificate. It must not be published."
            exit 1
          fi
          echo "Signed with a non-debug certificate."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: staff-app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # The app plays a notification chime, and expo-av drags RECORD_AUDIO in with it.
      # app.json blocks that with tools:node="remove", which only takes effect during
      # Gradle's manifest merge — so this is the only place the result can be checked.
      - name: Check permissions in the merged manifest
        working-directory: android
        run: |
          manifest=$(find app/build/intermediates -path '*merged_manifest*release*' -name AndroidManifest.xml | head -1)
          echo "Merged manifest: $manifest"
          grep -o 'android:name="android.permission.[A-Z_]*"' "$manifest" | sort -u
          if grep -q 'android.permission.RECORD_AUDIO' "$manifest"; then
            echo "::error::RECORD_AUDIO reached the APK - the app never records audio."
            exit 1
          fi
          grep -q 'usesCleartextTraffic="true"' "$manifest" || {
            echo "::error::Cleartext traffic is off - the app cannot reach an http:// server."
            exit 1
          }

  # A build that anyone can install, rather than an artifact that expires and needs a login.
  #
  # This is what the alternative app stores need. An Actions artifact is neither a stable address
  # nor a public one — Obtainium cannot fetch it, and Komi Store installs from *releases* on GitHub,
  # Codeberg, Forgejo or Gitea and has no direct-file source at all. A release is the one shape both
  # can read.
  #
  # The tag is created here, by the release itself, rather than pushed by an earlier job. That is
  # not a style choice: a tag pushed with GITHUB_TOKEN does not trigger another workflow, so a
  # "tag now, build on the tag" split would tag main forever and never build anything.
  release:
    name: Publish the release
    needs: [version, apk]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: staff-app-release-apk
          path: apk

      # Two names for one file, on purpose.
      #
      #   school-ai-staff.apk          — the same name in every release, which is what makes
      #                                  /releases/latest/download/school-ai-staff.apk work. That
      #                                  address never changes, so a QR code printed today still
      #                                  installs next term's build.
      #   school-ai-staff-<tag>.apk    — so a phone holding two downloads can tell them apart.
      - name: Name the file
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          built=$(find apk -name '*.apk' | head -1)
          mkdir -p out
          cp "$built" "out/school-ai-staff.apk"
          cp "$built" "out/school-ai-staff-${TAG}.apk"
          ls -l out

      # A belt to the concurrency group's braces. If the tag exists already then something raced
      # anyway, and publishing over it would silently replace a release's APK with a different
      # build — the exact failure this is here to prevent. Better a red main somebody looks at.
      - name: Refuse to publish over a release that already exists
        env:
          TAG: ${{ needs.version.outputs.tag }}
          # ls-remote against the URL rather than a remote, because this job has no checkout and
          # does not need one for a single question about a tag.
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists, so two runs picked the same version. Not publishing over the release that is already there — its APK would be replaced by a different build. Re-run this workflow once the other has finished, or push the next tag by hand."
            exit 1
          fi
          echo "Tag ${TAG} is free."

      # The release page is where a teacher actually lands, so it carries the two one-tap installs
      # rather than only the file. Written per release so the version and the links always agree.
      - name: Write the install section
        env:
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          repo_url="${SERVER}/${REPO}"
          apk_url="${repo_url}/releases/latest/download/school-ai-staff.apk"
          # Obtainium reads its action from the URI host, so there is no slash after the scheme.
          obtainium="obtainium://add/$(printf '%s' "$repo_url" | sed 's|:|%3A|g; s|/|%2F|g')"

          cat > release-notes.md <<NOTES
          ## Install on your phone

          **Android will warn you about installing outside the Play Store.** That is expected — this app is not on it.

          | | |
          | --- | --- |
          | **Obtainium** | [Add this app](${obtainium}) — tracks these releases and offers each new version as an update. Get Obtainium from [F-Droid](https://f-droid.org/en/packages/dev.imranr.obtainium/). |
          | **Komi Store** | Open \`${repo_url}\` in the app, or paste it into its search box. Get Komi Store from [F-Droid](https://f-droid.org/en/packages/zed.rainxch.githubstore/). |
          | **Neither** | Download [school-ai-staff-${TAG}.apk](${repo_url}/releases/download/${TAG}/school-ai-staff-${TAG}.apk) below and open it. |

          \`school-ai-staff.apk\` always points at the newest release:
          \`${apk_url}\`

          Your school's sign-in page shows QR codes for the first two, which is the quickest way on a phone.

          ---
          NOTES
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: out/*.apk
          body_path: release-notes.md
          # Appended under the install section, so what changed is still there.
          generate_release_notes: true
          # Komi Store and Obtainium both read the newest release. A draft or a prerelease is
          # invisible to them, so neither is ever what this should produce.
          draft: false
          prerelease: false
          make_latest: true
